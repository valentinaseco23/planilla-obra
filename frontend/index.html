<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivero Los Aromos Planificador</title>
<link rel="icon" type="image/png" href="img/logoicono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<section id="vista-login" class="vista vista-login">
  <div class="login-card">
    <div class="login-marca">
      <div class="marca-logo marca-logo-grande" aria-hidden="true">
        <svg viewBox="0 0 160 160" role="img" focusable="false">
          <g fill="none" stroke="#f45a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M80 140 L80 96" />
            <path d="M68 140 L80 128 L92 140" />
            <path d="M80 122 L46 122 L36 106" />
            <path d="M80 122 L114 122 L124 106" />
            <path d="M80 108 L56 108 L44 92" />
            <path d="M80 108 L104 108 L116 92" />
            <path d="M80 94 L64 94 L52 78" />
            <path d="M80 94 L96 94 L108 78" />
            <path d="M80 80 L72 80 L60 64" />
            <path d="M80 80 L88 80 L100 64" />
            <path d="M80 68 L74 58" />
            <path d="M80 68 L86 58" />
          </g>
        </svg>
      </div>
      <div>
        <h1>Vivero Los Aromos Planificador</h1>
        <p class="login-sub">Gestión de personal y tareas.</p>
      </div>
    </div>
    <form id="form-login">
      <label>Nombre de Usuario
        <input type="text" id="login-username" required autocomplete="username" placeholder="ingrese su usuario">
      </label>
      <label>Contraseña
        <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <p id="login-error" class="mensaje-error" hidden></p>
      <button type="submit" class="btn btn-primario btn-ancho">Ingresar</button>
    </form>
    <p class="login-nota">El usuario se los asignara el admin.</p>
  </div>
</section>

<section id="vista-app" class="vista vista-app" hidden>
  <aside class="sidebar">
    <div class="sidebar-marca">
      <div class="marca-logo marca-logo-chica" aria-hidden="true">
        <svg viewBox="0 0 160 160" role="img" focusable="false">
          <g fill="none" stroke="#f45a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M80 140 L80 96" />
            <path d="M68 140 L80 128 L92 140" />
            <path d="M80 122 L46 122 L36 106" />
            <path d="M80 122 L114 122 L124 106" />
            <path d="M80 108 L56 108 L44 92" />
            <path d="M80 108 L104 108 L116 92" />
            <path d="M80 94 L64 94 L52 78" />
            <path d="M80 94 L96 94 L108 78" />
            <path d="M80 80 L72 80 L60 64" />
            <path d="M80 80 L88 80 L100 64" />
            <path d="M80 68 L74 58" />
            <path d="M80 68 L86 58" />
          </g>
        </svg>
      </div>
      <span>Vivero Los Aromos Planificador</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-usuario">
      <div>
        <strong id="usuario-nombre"></strong>
        <span id="usuario-rol" class="badge-rol"></span>
      </div>
      <button id="btn-logout" class="btn btn-texto">Salir</button>
    </div>
  </aside>

  <main class="contenido" id="contenido">
  </main>
</section>

<section id="vista-empleado-overlay" class="vista-empleado-overlay" hidden>
  <div class="empleado-header">
    <span id="empleado-header-titulo">Cargando…</span>
    <button id="btn-volver-encargado" class="btn btn-volver">← Volver al encargado</button>
  </div>
  <div class="empleado-body" id="empleado-body"></div>
</section>

<div id="toast" class="toast" hidden></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
